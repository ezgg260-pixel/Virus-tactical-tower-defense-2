<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b2d31">
<title>Virus Tower Defense</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap');
:root{--bg:#0d1118;--pn:#0f1724;--tx:#d8dee9;--mu:#7c8799;--cy:#38bdf8}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 15%,#1a2331 0,#0b1018 55%,#070a10 100%);color:var(--tx);font-family:'JetBrains Mono',ui-monospace,monospace;overflow:hidden}
#w{position:relative;margin:auto;height:100%;max-width:520px;background:var(--bg);overflow:hidden}
canvas#g{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.top{position:absolute;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center;pointer-events:none}
.pill{background:var(--pn);border-radius:8px;height:30px;padding:0 10px;font-weight:700;font-size:14px;display:flex;gap:7px;align-items:center;min-width:74px}
.pill b{font-weight:700;flex:1;text-align:right}
.day{margin-left:auto;width:42%;height:42px;background:var(--pn);border-radius:8px;padding:5px 9px 0;text-align:center;font-size:14px;font-weight:600}
.dbar{position:relative;height:5px;margin-top:5px;border-radius:3px;background:linear-gradient(90deg,#e6c33a 0,#e0524a 62%,#7b5cf0 100%)}
.dbar i{position:absolute;top:6px;left:0;width:0;height:0;border:4px solid transparent;border-bottom:6px solid #fff;border-top:0;margin-left:-4px}
.btn{position:absolute;background:var(--pn);color:var(--tx);border:0;border-radius:8px;font:700 17px system-ui;width:46px;height:42px;cursor:pointer}
.btn:active{background:#3a3c42}
#spd{left:8px;top:calc(56px + env(safe-area-inset-top,0px))}
#mn{right:8px;top:calc(56px + env(safe-area-inset-top,0px))}
#hb{position:absolute;left:4px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px}
.sl{position:relative;width:46px;height:58px;background:var(--pn);border:0;border-top:3px solid #5a5d64;border-radius:3px;padding:0;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:600 10px system-ui}
.sl canvas{width:30px;height:30px}
.sl em{position:absolute;left:3px;top:1px;font-style:normal;color:var(--mu);font-size:8px}
.sl.on{background:#4a4d56;box-shadow:0 0 0 1.5px #ffffff55 inset}
.sl .c{color:#7ee08b}.sl.no .c{color:#ff6b61}
#info{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(320px,92%);background:var(--pn);border-radius:8px;padding:10px 12px;display:none;gap:10px;align-items:center}
#info div{flex:1;font-size:13px}#info small{display:block;color:var(--mu);margin-top:2px}
#info button{white-space:nowrap;border:0;border-radius:6px;background:#3a3c42;color:var(--tx);font:700 13px system-ui;padding:9px 12px}
#msg{position:absolute;top:calc(112px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--pn);padding:6px 12px;border-radius:7px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#md{z-index:40;position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}
#md .cd{position:relative;background:var(--pn);border-radius:10px;padding:20px;width:min(320px,100%);text-align:center}
#md h2{margin:0 0 6px;font-size:20px}#md p{white-space:pre-line;margin:0 0 14px;color:var(--mu);font-size:13px;line-height:1.6}
#md button{border:0;border-radius:7px;background:#4a4d55;color:var(--tx);font:700 14px system-ui;padding:10px 16px;margin:3px}
#scr,#ttl{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:20}
#ttl{z-index:30;align-items:center;justify-content:center;gap:12px;text-align:center}
#ttl h1{margin:6px 0 18px;font-weight:300;letter-spacing:.18em;font-size:26px;line-height:1.35}
#ttl button,#pop button,.bt{border:0;border-radius:8px;background:#4a4d55;color:var(--tx);font:700 14px system-ui;padding:12px 22px;min-width:190px;cursor:pointer}
#ttl .sm{min-width:0;padding:8px 14px;font-size:11px;background:#222327;color:var(--mu);margin:0 4px}
.hbar{display:flex;justify-content:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 8px 8px;background:#202125}
.hbar .pill{background:transparent;min-width:90px}
#pg{flex:1;overflow:auto;position:relative}
.nav{display:flex;background:var(--pn);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:4px}
.nav button{flex:1;border:0;border-radius:8px;background:transparent;color:var(--mu);font:700 9px system-ui;padding:7px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button span{font-size:18px}.nav button.on{background:#44474e;color:var(--tx)}
.row{background:#222327;margin:8px;padding:12px;border-radius:8px;display:flex;align-items:center;gap:10px;font-size:13px}
.row>div{flex:1}.row small{display:block;color:var(--mu);margin-top:3px;line-height:1.5}
.bt{min-width:0!important;padding:9px 14px!important;font-size:12px!important}.bt[disabled]{opacity:.4}
.xp{height:6px;background:#17181a;border-radius:3px;margin:6px 0;overflow:hidden}.xp i{display:block;height:100%;background:#d9b84a}
.nd{position:absolute;transform:translate(-50%,-50%);width:150px;background:#2f3136;border-top:3px solid #e0a23a;text-align:center;cursor:pointer;font-size:11px}
.nd b{position:absolute;left:8px;top:6px;font-size:22px;font-weight:600}.nd .h{padding:6px 8px 4px 40px;text-align:right}.nd .h small{display:block;color:var(--mu);font-size:9px}
.nd .s{padding:9px 0;background:#26272b;font-size:14px;color:#6d7077;letter-spacing:.05em}.nd.ok .s{color:#ececec}.nd.dn .s{color:#7ee08b}
.cg{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:8px}.cg div{aspect-ratio:1;background:#303136;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#55585f}.cg div.u{background:#3b3d44;border:1px solid #6b6e76}.cg div.on{background:#5a5d66}
#pop{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:2}
#pop .cd{background:var(--pn);border-radius:10px;padding:20px;width:min(320px,100%);text-align:center}#pop h2{margin:0 0 6px;font-size:20px}#pop p{margin:0 0 14px;color:var(--mu);font-size:13px;line-height:1.7;white-space:pre-line}#pop button{min-width:0;margin:3px}
#bn{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:20px;font-weight:600;color:#ffffffb0;pointer-events:none;display:none;text-shadow:0 1px 4px #0009}
#pst{position:absolute;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:none;justify-content:center}
#start{min-width:160px!important;font-size:16px!important;padding:13px 20px!important}
#pst{flex-direction:column;align-items:center;gap:8px}#tw-b{min-width:160px!important}
#ic{position:absolute;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s}#ic.show{opacity:1;transition:none}#ic b{font-size:34px;font-weight:600}#ic small{color:#666;font-size:14px;margin-top:4px}
#tw{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:45}
#pop .cd,#tw .cd{position:relative;background:var(--pn);border-radius:10px;padding:16px;width:min(380px,100%);text-align:left}
#pop h2,#tw h2{text-align:center;margin:0 0 12px;font-size:16px}#pop p{text-align:center;margin:8px 0 0}
#md .x,#pop .x,#tw .x{position:absolute;right:8px;top:8px;width:30px;height:30px;min-width:0!important;padding:0!important;margin:0!important;background:transparent!important;font-size:16px!important;color:var(--mu)}
.dg{display:grid;grid-template-columns:128px 1fr;gap:10px}.dg small,.tg small{display:block;color:var(--mu);font-size:10px;margin-bottom:5px}
.chc{background:#2b2d31;border-radius:6px;padding:9px;margin-bottom:6px;font-size:12px;font-weight:700;border-left:3px solid transparent;cursor:pointer}.chc.on{background:#3d4047;border-left-color:#7ee08b}.chc.lk{opacity:.4}.chc small{margin:2px 0 0;font-weight:400}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:10px}.g4 div{background:#2b2d31;border-radius:6px;padding:7px;font-size:12px;font-weight:700}.g4 small{margin:0 0 2px!important}
.en{background:#2b2d31;border-radius:6px;padding:8px;font-size:20px;display:flex;gap:10px;min-height:38px}.en i{font-style:normal}
.df{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.df button{min-width:0!important;padding:10px 18px!important;font-size:13px!important}
.tg{display:grid;grid-template-columns:116px 1fr;gap:8px}#tw-l{background:#26272b;border-radius:6px;padding:6px;min-height:120px}.li{display:flex;gap:6px;align-items:center;font-size:11px;padding:6px 3px;border-bottom:1px solid #333}.li img{width:18px}
#tw-r{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;align-content:start}.tc{background:#2b2d31;border-radius:6px;padding:8px;font-size:11px;border:1px solid transparent;cursor:pointer}.tc.on{border-color:#7ee08b;background:#34373d}.tc img{width:28px;display:block;margin-bottom:4px}.tc b{display:block}.tc small{margin:2px 0 0!important}
.row>.ai{flex:none;width:40px;height:40px;background:#3a3c42;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#ffd75e;font-size:12px}
#w{box-shadow:0 0 40px #000;background:#0d1118}
.pill,.day,.btn,.sl,#info,#msg{background:#05080dcc!important;border:1px solid #ffffff18;box-shadow:0 4px 12px #0007;backdrop-filter:blur(4px);font-family:inherit}
.day .dbar,.dbar{height:7px;border-radius:99px;border:1px solid #374151}
.sl{border-radius:8px;border-top-width:2px;background:#111827dd!important}.sl.on{border-color:var(--cy);box-shadow:0 0 12px #38bdf866}
.btn{font-family:inherit}.btn.act{border-color:var(--cy);box-shadow:0 0 10px #38bdf855;color:#fff}

#emp{position:absolute;right:8px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%!important;font-size:10px;line-height:1.2;border:1px solid #ff6b6b88;color:#ffb4b4;display:flex;align-items:center;justify-content:center;text-align:center}
#emp[disabled]{opacity:.45}
#up{background:#0e3a52;color:#bfe9ff}
#md .cd,#pop .cd,#tw .cd,.modal{background:linear-gradient(180deg,#111827,#0b111b)!important;border:1px solid #334155;box-shadow:0 15px 50px #000}
.hbar{background:#070b12}.nav{background:#070b12;border-top:1px solid #1e293b}.nav button.on{background:#12304a;color:#9fdcff}
.row,.chc,.g4 div,.en,.tc,#tw-l{background:#121a28!important}
.nd{background:#101827;border-radius:4px;box-shadow:0 4px 14px #0008}.nd .s{background:#0b1220}
#md button,#pop button,#ttl button,.bt{background:#1d4ed8!important;border:1px solid #60a5fa66!important;font-family:inherit}
#md #nw,#md #ex,#md #es,#md #rt,#ttl .sm,#pop #no,#pop #p-df{background:#162033!important;border-color:#ffffff1c!important}
.bt[disabled]{background:#1a2333!important;border-color:#ffffff10!important}
#ttl{background:radial-gradient(circle at 50% 30%,#1b2740 0,#0b1018 70%)}
.xp i{background:linear-gradient(90deg,#f59e0b,#fb923c)}

.top{gap:6px}.pill{height:32px;border-radius:10px;font-size:13px;min-width:0;flex:1;padding:0 9px;gap:6px}.pill.hp{color:#fda4af}.pill.hp b{color:#ffe4e6}
.top2{position:absolute;left:8px;right:8px;top:calc(46px + env(safe-area-inset-top,0px));display:flex;gap:6px;align-items:stretch}
.sp{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:12px;color:#e2e8f0;font:800 13px 'JetBrains Mono',monospace;cursor:pointer;border:1px solid #38bdf866;background:linear-gradient(180deg,#0c2a40,#06101b)!important;box-shadow:0 0 14px #38bdf833,inset 0 1px 0 #ffffff14;position:static!important}
.sp i{font-style:normal;color:#38bdf8;font-size:11px}.sp b{font-weight:800}
.sp.s2{border-color:#fbbf2488;box-shadow:0 0 14px #fbbf2444}.sp.s2 i{color:#fbbf24}.sp.s3{border-color:#fb718588;box-shadow:0 0 16px #fb718555}.sp.s3 i{color:#fb7185}.sp.s0{border-color:#ffffff22;box-shadow:none}.sp.s0 i{color:#94a3b8}
.sp:active,.hb2:active{transform:translateY(1px)}
.day{flex:1;min-width:0;margin:0!important;width:auto!important;height:38px!important;padding:5px 9px 0!important;text-align:left!important;border-radius:12px}
.dh{display:flex;justify-content:space-between;font-size:10px;font-weight:800;letter-spacing:.06em}.dh em{font-style:normal;color:#fbbf24}.dh em.n{color:#a78bfa}
.dbar{margin-top:4px!important}.dbar i{top:-1px!important;border-bottom:0!important;border-top:6px solid #fff!important;border-left:3px solid transparent!important;border-right:3px solid transparent!important;margin-left:-3px!important;filter:drop-shadow(0 0 3px #fff)}
.hb2{position:static!important;height:38px!important;width:auto!important;min-width:38px;padding:0 10px!important;border-radius:12px!important;font-size:12px!important;letter-spacing:.04em}
#hb{top:52%!important;gap:6px!important}
.sl{width:54px!important;height:66px!important;border-radius:10px!important;gap:3px!important}.sl canvas{width:32px!important;height:32px!important}
.sl .c{color:#facc15!important;font-size:10px!important}.sl.no .c{color:#f87171!important}.sl em{font-size:9px!important;left:5px!important;top:3px!important}
#emp{bottom:calc(60px + env(safe-area-inset-bottom,0px))!important}
.tip{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:9px;color:#64748b;background:#020617aa;border:1px solid #ffffff10;border-radius:7px;padding:5px 8px;pointer-events:none;max-width:56%;line-height:1.5}
#tipL{left:8px}#tipR{right:8px;max-width:46%;text-align:right;color:#cbd5e1;display:none}
#info{z-index:5}
#mapo{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:45}
#mapo .cd{position:relative;background:linear-gradient(180deg,#111827,#0b111b);border:1px solid #334155;border-radius:12px;padding:16px;width:min(360px,100%)}
#mapo h2{margin:0 0 10px;text-align:center;font-size:15px;letter-spacing:.1em}#mapo canvas{width:100%;display:block;border-radius:8px;background:#070b12}
#mapo .x{position:absolute;right:8px;top:8px;width:30px;height:30px;background:transparent!important;border:0!important;color:var(--mu);font-size:16px}

/* ===== VISUAL POLISH / RESPONSIVE SPEED CONTROL ===== */
.top{z-index:12;gap:7px}
.pill{background:linear-gradient(180deg,#121c2bdf,#080e18ed)!important;border:1px solid #ffffff20!important;box-shadow:0 5px 16px #0008,inset 0 1px 0 #ffffff12!important}
.top2{z-index:12;align-items:center;gap:6px}
.speedbar{height:38px;display:flex;align-items:center;gap:3px;padding:3px 4px;border-radius:11px;border:1px solid #38bdf855;background:linear-gradient(180deg,#10243aee,#08111eee);box-shadow:0 5px 16px #0009,inset 0 1px 0 #ffffff18;flex:none}
.speed-label{font-size:8px;font-weight:800;letter-spacing:.08em;color:#7dd3fc;padding:0 4px 0 5px}
.speed-opt{height:28px;min-width:29px;padding:0 7px;border-radius:7px;border:1px solid transparent;background:transparent;color:#8fa3ba;font:800 11px 'JetBrains Mono',monospace;transition:background .16s ease,color .16s ease,box-shadow .16s ease,transform .16s ease}
.speed-opt.active{color:#e0f2fe;background:linear-gradient(180deg,#1674a7,#0e456d);border-color:#67d7ff88;box-shadow:0 0 12px #38bdf855,inset 0 1px 0 #ffffff35}
.speed-opt:active{transform:scale(.94)}
#pz{border:1px solid #ffffff25!important;background:linear-gradient(180deg,#1b293b,#0c1421)!important;color:#e2e8f0!important;box-shadow:0 5px 14px #0008!important}
.day{background:linear-gradient(180deg,#111d2dF2,#080e18F2)!important;border:1px solid #ffffff20!important;box-shadow:0 5px 16px #0008,inset 0 1px 0 #ffffff12!important}
.dbar{background:#202d40!important;border-color:#ffffff20!important;overflow:hidden}
.dbar i{height:100%;width:0;border:0!important;top:0!important;margin:0!important;background:linear-gradient(90deg,#38bdf8,#a78bfa,#f59e0b);box-shadow:0 0 8px #7dd3fc;transition:left .12s linear}
.hb2{border:1px solid #ffffff20!important;background:linear-gradient(180deg,#182538,#0a111d)!important;box-shadow:0 5px 14px #0008!important}
.sl{background:linear-gradient(180deg,#172337,#0b1220)!important;border:1px solid #ffffff20!important;box-shadow:0 5px 14px #0007!important;transition:transform .14s,border-color .14s,box-shadow .14s}
.sl.on{border-color:#67d7ff!important;background:linear-gradient(180deg,#123a55,#0c1b2b)!important;box-shadow:0 0 15px #38bdf866,inset 0 0 0 1px #67d7ff55!important}
.sl:active{transform:scale(.96)}
#info{background:linear-gradient(180deg,#142238f5,#09111df5)!important;border:1px solid #60a5fa55!important;box-shadow:0 12px 30px #000b!important}
#msg{border:1px solid #38bdf855!important;background:#0b1a2bed!important;box-shadow:0 6px 18px #0009!important}
#emp{background:radial-gradient(circle at 35% 25%,#3c2530,#170d17)!important;box-shadow:0 0 16px #fb718533,0 6px 16px #0009!important}
@media(max-width:390px){.speed-label{display:none}.speedbar{gap:2px;padding:3px}.speed-opt{min-width:27px;padding:0 5px}.top2{gap:4px}.hb2{min-width:34px!important;padding:0 7px!important}}
</style>
</head>
<body>
<div id="w">
<canvas id="g"></canvas>
<div class="top">
 <div class="pill"><canvas id="ig" width="40" height="40" style="width:18px;height:18px"></canvas><b id="gold">0</b></div>
 <div class="pill"><span style="color:#67e8f9">&#11041;</span><b id="pts">0 C</b></div>
 <div class="pill hp"><span>&#10084;</span><b id="chp">1000</b></div>
</div>
<div class="top2">
 <div class="speedbar" id="spd" role="group" aria-label="ความเร็วเกม">
  <span class="speed-label">SPEED</span>
  <button type="button" data-speed="1" class="speed-opt active">1×</button>
  <button type="button" data-speed="2" class="speed-opt">2×</button>
  <button type="button" data-speed="3" class="speed-opt">3×</button>
 </div>
 <div class="day"><div class="dh"><span id="day">DAY 1</span><em id="ph">DAY</em></div><div class="dbar"><i id="pin"></i></div></div>
 <button class="btn hb2" id="pz">&#10074;&#10074;</button><button class="btn hb2" id="mn">&#9776;</button><button class="btn hb2" id="mapb">MAP</button>
</div>
<div id="hb"></div>
<button class="btn" id="emp">EMP</button>
<div class="tip" id="tipL">แตะช่อง 1-5 แล้วแตะพื้นเพื่อสร้าง • แตะสิ่งปลูกสร้างเพื่อเลือก</div><div class="tip" id="tipR"></div>
<div id="mapo"><div class="cd"><button class="x" id="mp-x">&#10005;</button><h2>MAP</h2><canvas id="mpc"></canvas><p style="font-size:10px;color:var(--mu);margin:8px 0 0;text-align:center">&#9650; ขาว/แดง = ไวรัส &#9670; ม่วง = บอส • จุดแดง = จุดเกิด • เส้นส้ม = ทางที่สั้นที่สุด</p></div></div>
<div id="bn"></div><div id="pst"><button class="bt" id="start">Start</button><button class="bt" id="tw-b">Tower</button></div>
<div id="info"><div><span id="in-n"></span><small id="in-s"></small></div><button id="up">อัปเกรด</button><button id="sell">ขาย</button></div>
<div id="msg"></div>
<div id="ic"></div>
<div id="tw"><div class="cd"><button class="x" id="tw-x">✕</button><h2>Choose Your Tower</h2><div class="tg"><div id="tw-l"></div><div id="tw-r"></div></div></div></div>
<div id="ttl"><canvas id="tc" width="240" height="240" style="width:120px;height:120px"></canvas><h1>VIRUS<br>TOWER DEFENSE</h1><button id="t-go">เริ่มเล่น</button><button id="t-co">เล่นต่อ</button><div><button class="sm" id="t-ex">Export Save</button><button class="sm" id="t-im">Import Save</button></div></div>
<div id="scr"></div>
<div id="md"><div class="cd"><button class="x" id="xx">✕</button><h2 id="mt"></h2><p id="mp"></p><button id="rs">เล่นต่อ</button><button id="es"></button><button id="rt"></button><button id="nw">Restart</button><button id="ex">Quit</button></div></div>
</div>
<script>
'use strict';

function follow(sp){const o=[[sp[0],sp[1]]];let r=sp[0],c=sp[1],n=0;while((r!==core.r||c!==core.c)&&n++<260){let b=null,bd=dist[r*COLS+c];for(const[dr,dc]of N){const rr=r+dr,cc=c+dc;if(ok(rr,cc)&&dist[rr*COLS+cc]<bd){bd=dist[rr*COLS+cc];b=[rr,cc]}}if(!b)break;r=b[0];c=b[1];o.push(b)}return o}

ACT.buy=k=>{const s=SH.find(z=>z[0]===k),l=M.up[k],c=s[2]*(l+1);if(l>=5||M.coin<c)return;M.coin-=c;M.up[k]++;saveM();showHub()};
PG.mas=()=>{const id=mas,d=D.find(z=>z.id===id),v=M.xp[id]||0,l=mlv(id),nx=LV[l]||LV[4],pv=LV[l-1]||0;

PG.map=()=>{const h=1150;let l='';for(let i=1;i<STG.length;i++)l+='<line x1="'+POS[i-1][0]+'%" y1="'+POS[i-1][1]/100*h+'" x2="'+POS[i][0]+'%" y2="'+POS[i][1]/100*h+'" stroke="#55585f" stroke-width="2"/>';
 return '<div style="position:relative;height:'+h+'px;background-image:linear-gradient(#34363b 1px,transparent 1px),linear-gradient(90deg,#34363b 1px,transparent 1px);background-size:40px 40px"><svg width="100%" height="'+h+'" style="position:absolute;left:0;top:0">'+l+'</svg><div style="position:absolute;left:10px;top:10px;background:#3a3c42;padding:5px 10px;border-radius:5px;font-size:12px">Chapter 1</div>'+STG.map((t,i)=>{const c=i<M.clr?'dn':i===M.clr?'ok':'';return '<div class="nd '+c+'" data-a="stage" data-v="'+i+'" style="left:'+POS[i][0]+'%;top:'+POS[i][1]/100*h+'px;border-top-color:'+(i===4?'#7ee08b':i===7?'#6aa7ff':'#e0a23a')+'"><b>'+(i+1)+'</b><div class="h"><small>Chapter 1</small>'+t.n+'</div><div class="s">'+(i<M.clr?'CLEARED ✓':i===M.clr?'Challenge 0/1':'LOCKED')+'</div></div>'}).join('')+'</div>'};
let PS={i:0,lvl:0,ch:0};const DM=[1,1.5,2.4];

 $('p-g').innerHTML=[['Selected Challenge',PS.ch?'Challenge':'Campaign'],['Gamemode','Survive'],['Game Time',t.days+' day'+(t.days>1?'s':'')],['Starting Resource',160+M.up.gold*20]].map(a=>'<div><small>'+a[0]+'</small>'+a[1]+'</div>').join('');
 $('p-en').innerHTML='<i style="color:#ececee">■</i>'+(PS.i>0?'<i style="color:#ff5a52">▲</i>':'')+(PS.i>0||PS.lvl>0||PS.ch?'<i style="color:#a06bff">⬢</i>':'');
 $('p-df').textContent=['Normal','Hard','Expert'][PS.lvl];$('p-p').textContent=lock?'ผ่านด่านก่อนหน้าเพื่อปลดล็อก':'ไวรัส: ขาว=ทั่วไป • แดง=พิเศษเร็วแรง • ม่วง=บอส\nรางวัล '+Math.round(t.rw*(1+.5*PS.lvl+.5*PS.ch))+' ทอง'+(PS.i===M.clr?' • +1 เหรียญ • +1 เพชร':'');$('go').style.display=lock?'none':'inline-block'}

 let g='';for(let i=0;i<55;i++)g+=i<D.length?'<div class="u'+(i===cod?' on':'')+'" data-a="cod" data-v="'+i+'"><img src="'+mini(D[i].id,16).toDataURL()+'" width="26"></div>':'<div data-a="cod" data-v="'+i+'">'+(1+Math.floor(i/8))+'-'+(i%8+1)+'</div>';
 return '<div style="padding:10px 14px 0;font-weight:700">TOWER CODEX <span style="float:right;color:var(--mu)">'+D.length+' / 55</span></div>'+det+'<div class="cg">'+g+'</div>'};

 const st=ST(),coin=Math.round(((w?st.rw:st.rw*.25)+S.kills)*(1+.5*(S.lvl|0)+.5*(S.chal|0))),first=w&&M.clr===S.stage;M.coin+=coin;if(first){M.clr++;M.med++;M.gem++}M.st.maxday=Math.max(M.st.maxday,S.day);saveM();
